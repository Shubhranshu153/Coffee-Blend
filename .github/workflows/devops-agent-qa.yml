name: "Vercel Release Testing"

# PR merge-time check (the FAST, scoped one). Full UAT happens separately at
# release time — see release-uat.yml.
#
# On a pull_request, the QA action tests the target in TestProfile ki-60548fd2
# and the DevOps Agent GitHub App (slug 'aws-devops-agent-us-east-1') posts a
# check run named "QA Agent #<timestamp>" on the PR head. That name changes
# every run, so the poller below matches the stable app slug instead and mirrors
# the verdict into this job's "release-testing" check — which a branch-protection
# rule on main can require, blocking merge until it passes.
#
# The old repository_dispatch/production-promotion path was removed: production
# promotion is now gated at release time by release-uat.yml (with Vercel
# automatic aliasing OFF), so gating every prod deploy here would only
# reintroduce the per-deploy hold we set out to avoid.

on:
  pull_request:
    branches: [main]

jobs:
  release-testing:
    runs-on: ubuntu-latest

    # DEVOPS_AGENT_WEBHOOK_URL/SECRET are environment secrets scoped to
    # Production. Production currently has no protection rules; if required
    # reviewers are ever added, every PR run will block awaiting approval.
    # Moving the two secrets to repo level would remove that coupling.
    environment: Production

    permissions:
      checks: read # poll the agent's result check run
      contents: read
      pull-requests: read # QA action resolves the PR from the commit

    steps:
      - name: Record QA trigger time
        run: echo "QA_TRIGGER_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # Scoped to the menu view to keep the merge check fast (the agent is slow
      # when exploring the whole site). Full-site UAT is release-uat.yml's job.
      - name: Trigger Release Tests
        uses: aws-actions/devops-agent-qa@v1
        with:
          webhook-url: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
          test-profile-id: ki-60548fd2-e150-4183-a05b-efee743647b7
          test-requirement: "Only test the menu view tab (menu.html) — verify the menu page loads and its items render. Skip all other pages."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Fail-closed poller: match the DevOps Agent App by stable slug, ignore
      # stale checks left on this SHA by earlier runs (started_at >= trigger
      # time), exit 1 on any non-pass conclusion or on timeout. No job-level
      # timeout-minutes on purpose, so a stall blocks the merge rather than
      # silently passing.
      - name: Wait for QA Agent result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AGENT_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT_APP: aws-devops-agent-us-east-1
          POLL_INTERVAL: "15"
          TIMEOUT_SECONDS: "1800" # 30 min
        run: |
          set -euo pipefail
          floor=$(( QA_TRIGGER_EPOCH - 120 ))
          echo "agent sha:         $AGENT_SHA"
          echo "matching app slug: $AGENT_APP"
          deadline=$(( SECONDS + TIMEOUT_SECONDS ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            resp=$(timeout 60 gh api \
              "repos/$REPO/commits/$AGENT_SHA/check-runs?per_page=100" 2>/dev/null || true)
            run_json=""
            if [ -n "$resp" ]; then
              run_json=$(printf '%s' "$resp" | jq -c \
                --arg app "$AGENT_APP" --argjson since "$floor" '
                [ .check_runs[]?
                  | select(.app.slug == $app)
                  | select((.started_at | fromdateiso8601) >= $since) ]
                | sort_by(.started_at) | last // empty')
            fi
            if [ -z "$run_json" ]; then
              echo "[$(date -u +%H:%M:%S)] no QA Agent check run yet; waiting ${POLL_INTERVAL}s"
              sleep "$POLL_INTERVAL"; continue
            fi
            name=$(printf '%s' "$run_json" | jq -r '.name')
            status=$(printf '%s' "$run_json" | jq -r '.status')
            conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion // "null"')
            echo "[$(date -u +%H:%M:%S)] $name: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success|neutral|skipped) echo "::notice::QA gate PASSED ($conclusion)"; exit 0 ;;
                *) echo "::error::QA gate FAILED (conclusion=$conclusion)"; exit 1 ;;
              esac
            fi
            sleep "$POLL_INTERVAL"
          done
          echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for QA Agent result on $AGENT_SHA"
          exit 1
