name: "Vercel Release Testing"

# ONE gate surface: the job's own "release-testing" check run.
#
# The QA action is fire-and-forget; the DevOps Agent App posts a dynamically
# named "QA Agent #<ts>" check. The poller below mirrors that verdict into THIS
# job's conclusion, so GitHub publishes a single, stable "release-testing" check
# run on the commit. That one check is what you require everywhere:
#   - GitHub branch protection on main  -> gates PR merge
#   - Vercel Deployment Checks          -> gates preview + production promotion
#     (register the single check named "release-testing"; it concludes on both
#      preview commits (dev push / PR) and production commits (main deploy)).
#
# We intentionally do NOT write extra "Vercel - coffee-blend: ..." commit
# statuses; those created duplicate names in Vercel's picker. The one check run
# covers all paths.
#
# Full-site UAT at release time lives in release-uat.yml (tag/cron/manual).

on:
  pull_request:
    branches: [main]
  # Push to the preview branch so the job's own "release-testing" CHECK RUN
  # concludes on each preview deployment's commit. Vercel's Deployment Checks
  # picker offers a check per-environment based on the environments it has seen
  # that check conclude on (this is how a "lint" check gains a preview option).
  # Without this, dev pushes produced only an orphan commit status and no check
  # run, so no preview option ever appeared in the picker.
  push:
    branches: [dev]
  repository_dispatch:
    types: ['vercel.deployment.ready']
  # Manual lever: fire release-testing on demand. System-triggered events
  # (repository_dispatch, schedule) create runs reliably here even when push/PR
  # run-creation or runner pickup is slow, so this is a dependable way to
  # (re)produce the check on a given ref for Vercel Deployment Checks.
  workflow_dispatch: {}

jobs:
  release-testing:
    # Run for PRs, for dev pushes (to emit the preview check run), and for any
    # Vercel deployment dispatch (preview or production). Casing tolerated: the
    # dispatch payload types `environment` as a bare string ('production'
    # observed lowercase; preview assumed 'preview').
    if: >-
      ${{ github.event_name == 'pull_request'
          || github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || github.event.client_payload.environment == 'preview'
          || github.event.client_payload.environment == 'Preview'
          || github.event.client_payload.environment == 'production'
          || github.event.client_payload.environment == 'Production' }}
    runs-on: ubuntu-latest

    # DEVOPS_AGENT_WEBHOOK_URL/SECRET are environment secrets scoped to
    # Production. If required reviewers are added to that GitHub environment,
    # every run will block on approval; move the secrets to repo level to decouple.
    environment: Production

    permissions:
      checks: read # poll the agent's result check run
      contents: read
      pull-requests: read # QA action resolves the PR from the commit

    steps:
      - name: Record QA trigger time
        run: echo "QA_TRIGGER_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # Scoped to the menu view to keep this fast (the agent is slow full-site).
      # Tests the static URL in TestProfile ki-60548fd2 (the dev/preview alias);
      # the action sends no per-deployment URL. NOTE: a production dispatch would
      # therefore also be tested against that same static URL — acceptable only
      # because the profile is static; revisit if production must test its own
      # build. Full-site UAT is release-uat.yml.
      - name: Trigger Release Tests
        uses: aws-actions/devops-agent-qa@v1
        with:
          webhook-url: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
          test-profile-id: ki-60548fd2-e150-4183-a05b-efee743647b7
          test-requirement: "Only test the menu view tab (menu.html) — verify the menu page loads and its items render. Skip all other pages."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Fail-closed poller. Matches the DevOps Agent App by stable slug (its
      # check name "QA Agent #<ts>" is dynamic), ignores stale checks from
      # earlier runs on this SHA (started_at >= trigger time), exits 1 on any
      # non-pass conclusion or on timeout. No job-level timeout-minutes: a stall
      # must fail the job so the gate blocks rather than silently passing.
      - name: Wait for QA Agent result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR head on pull_request; github.sha (default-branch HEAD) on
          # dispatch — where the QA action makes the agent post its check.
          AGENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGENT_APP: aws-devops-agent-us-east-1
          POLL_INTERVAL: "15"
          TIMEOUT_SECONDS: "1800" # 30 min
        run: |
          set -euo pipefail
          floor=$(( QA_TRIGGER_EPOCH - 120 ))
          echo "event:             ${{ github.event_name }}"
          echo "agent sha:         $AGENT_SHA"
          echo "matching app slug: $AGENT_APP"
          deadline=$(( SECONDS + TIMEOUT_SECONDS ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            resp=$(timeout 60 gh api \
              "repos/$REPO/commits/$AGENT_SHA/check-runs?per_page=100" 2>/dev/null || true)
            run_json=""
            if [ -n "$resp" ]; then
              run_json=$(printf '%s' "$resp" | jq -c \
                --arg app "$AGENT_APP" --argjson since "$floor" '
                [ .check_runs[]?
                  | select(.app.slug == $app)
                  | select((.started_at | fromdateiso8601) >= $since) ]
                | sort_by(.started_at) | last // empty')
            fi
            if [ -z "$run_json" ]; then
              echo "[$(date -u +%H:%M:%S)] no QA Agent check run yet; waiting ${POLL_INTERVAL}s"
              sleep "$POLL_INTERVAL"; continue
            fi
            name=$(printf '%s' "$run_json" | jq -r '.name')
            status=$(printf '%s' "$run_json" | jq -r '.status')
            conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion // "null"')
            echo "[$(date -u +%H:%M:%S)] $name: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success|neutral|skipped) echo "::notice::QA gate PASSED ($conclusion)"; exit 0 ;;
                *) echo "::error::QA gate FAILED (conclusion=$conclusion)"; exit 1 ;;
              esac
            fi
            sleep "$POLL_INTERVAL"
          done
          echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for QA Agent result on $AGENT_SHA"
          exit 1
