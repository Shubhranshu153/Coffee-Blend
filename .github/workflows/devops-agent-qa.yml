name: "Vercel Release Testing"

# Runs the AWS DevOps Release Testing Agent on two paths:
#
#   pull_request         -> publishes a check on the PR head so merges can be
#                           gated via branch protection. This path also runs
#                           from the PR branch, so it is testable before merge.
#
#   repository_dispatch  -> 'vercel.deployment.ready' is the only event Vercel
#                           sends BEFORE promoting a production deployment, so
#                           it is the only one usable as a promotion gate.
#                           '.success' and '.promoted' both fire after promotion.
#
# STAGE 1: the diagnostic step is temporary. The Release Testing Agent creates
# its result check run asynchronously from the AgentSpace (this workflow only
# signs a webhook, and the action's declared check-run-id output is never set),
# so the check's name and app slug are not yet known. The diagnostic prints
# them; Stage 2 replaces it with a poll that blocks on the real result.
#
# Until Stage 2 lands this succeeds as soon as the webhook is DELIVERED, not
# when tests pass. Do not make it a required check or a Deployment Check yet.

on:
  pull_request:
    branches: [main]
  repository_dispatch:
    types: ['vercel.deployment.ready']

jobs:
  release-testing:
    # PRs always run. Dispatches only run for production, because the QA action
    # accepts no target-URL input: the URL under test comes from TestProfile
    # ki-60548fd2, which points at the production domain, so a preview dispatch
    # would test the wrong thing.
    #
    # Both casings are accepted for the dispatch payload's `environment`, which
    # is typed as a bare string: Vercel's docs example is lowercase
    # 'production', but this repo's GitHub environments are capitalized. A case
    # mismatch would silently skip the job; the echo-payload job records the
    # real value so this can be collapsed to one comparison once confirmed.
    if: >-
      ${{ github.event_name == 'pull_request'
          || github.event.client_payload.environment == 'production'
          || github.event.client_payload.environment == 'Production' }}
    runs-on: ubuntu-latest

    # DEVOPS_AGENT_WEBHOOK_URL/SECRET are environment secrets scoped to
    # Production, not repo-level secrets, so the job cannot see them without
    # this. Production currently has no protection rules; if required reviewers
    # are ever added, every PR run will block awaiting approval. Moving the two
    # secrets to repo level would remove that coupling.
    environment: Production

    permissions:
      actions: read # actions/status calls listJobsForWorkflowRun
      statuses: write # actions/status calls createCommitStatus
      checks: read # read the agent's result check run
      contents: read
      pull-requests: read # QA action resolves the PR from the commit

    steps:
      # Dispatch path only. On pull_request this action would resolve
      # context.sha, which is the ephemeral merge commit rather than the PR
      # head, so the status would land where branch protection cannot see it.
      # The PR path instead relies on this job's own check run, which GitHub
      # attaches to the PR head automatically.
      - name: Report pending status to Vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - coffee-blend: release-testing"

      # On pull_request this action uses pull_request.head.sha, so its webhook
      # carries the PR head and the agent's check lands on the PR.
      - name: Trigger Release Tests
        uses: aws-actions/devops-agent-qa@v1
        with:
          webhook-url: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
          test-profile-id: ki-60548fd2-e150-4183-a05b-efee743647b7
          # test-requirement: <OPTIONAL_FOCUS_AREA>
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # STAGE 1 DIAGNOSTIC — delete once Stage 2 is wired.
      # Captures the agent's check-run name and app.slug so the Stage 2 poll can
      # match on them, and measures a known SHA hazard on the dispatch path:
      # actions/status reads client_payload.git.sha (the deployed commit) while
      # the QA action falls back to context.sha, which under repository_dispatch
      # is default-branch HEAD. If the agent's check lands on a commit other
      # than the deployed one, the gate can never satisfy and it must be raised
      # upstream with aws-actions/devops-agent-qa.
      - name: Observe check runs on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.sha
                || github.event.client_payload.git.sha }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "event:                            ${{ github.event_name }}"
          echo "tested sha (what QA was sent):    $TESTED_SHA"
          echo "workflow context sha:             $CONTEXT_SHA"
          if [ "$TESTED_SHA" != "$CONTEXT_SHA" ]; then
            echo "::notice::tested sha differs from context sha - expected on pull_request (context is the merge commit)"
          fi

          echo "waiting 90s for the AgentSpace to create its check run..."
          sleep 90

          for entry in "tested:$TESTED_SHA" "context:$CONTEXT_SHA"; do
            label="${entry%%:*}"
            sha="${entry##*:}"
            echo "--- check runs on $label commit ($sha) ---"
            gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              --jq '.check_runs[] | "name=\(.name) app=\(.app.slug) status=\(.status) conclusion=\(.conclusion)"' \
              || echo "(query failed)"
          done

  # STAGE 1 DIAGNOSTIC JOB — delete along with the step above.
  # Runs unconditionally so that if the guard on release-testing skips (an
  # unexpected or wrong-case environment value), we still learn what the payload
  # actually contained instead of seeing an empty run and guessing.
  echo-payload:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dump event context
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "event:       ${{ github.event_name }}"
          echo "action type: ${{ github.event.action }}"
          echo "client_payload (empty on pull_request):"
          echo "$PAYLOAD"
